[project]
name = "scanlab-mac"
version = "0.1.0"
description = "ScanLab Mac geometry engine and scanlab-mcp server (PRD §4.7, M25)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "trimesh>=4.4",
    "pymeshfix>=0.17",
    "manifold3d>=3.0",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "lxml>=5.0",
    "mcp>=1.9",
    "fast-simplification>=0.2.0",
    "rtree>=1.4.1",
]

[project.scripts]
scanlab-mcp = "scanlab.mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
